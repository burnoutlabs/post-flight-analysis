# pyproject.toml
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-flight-analysis"
version = "0.1.0"
description = "Standardize and analyze mixed altimeter logs"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt"]
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "pytz>=2024.1",
  "typer>=0.12.3",
]

[project.scripts]
pfa = "pfa.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# Exploratory scripts kept as they were written; not part of the package.
extend-exclude = ["notebooks/playground"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
